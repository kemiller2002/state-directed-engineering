name: SDE distribution

on:
  pull_request:
    paths:
      - "distribution/**"
      - "doctrine/**"
      - "method/**"
      - "templates/sde/**"
  push:
    paths:
      - "distribution/**"
      - "doctrine/**"
      - "method/**"
      - "templates/sde/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - name: verify a fresh install of the just-built package in an isolated directory
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          node "$GITHUB_WORKSPACE/distribution/bin/sde.mjs" init
          node "$GITHUB_WORKSPACE/distribution/bin/sde.mjs" verify
